name: CG Link Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '30 9 * * 5'

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run lychee link checker
        # Non-blocking: external links rot over time (moved docs, bot-blocking
        # sites like Reddit/Azure portal) independent of any given PR's diff.
        # Report findings without gating merges on inherited link drift.
        # --include-verbatim: also scan URLs inside fenced code blocks. The README
        # "Before vs. After" sample and the examples' Sources lists live in code
        # blocks; without this flag lychee never saw them (v1.15 post-mortem).
        continue-on-error: true
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          args: --verbose --no-progress --include-verbatim '*.md' 'examples/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
